{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Page</title>
    <style>
        
    </style>
</head>

<body dir="rtl">
    <main>
        <!-- Header -->

        <header style="display: flex;justify-content: center;">
            <h1>مدیریت فایل</h1>
        </header>

        <!-- Upload -->

        <section class="upload-section">
            <h2>آپلود فایل جدید</h2>
            <br />
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <label for="file-input"> انتخاب فایل </label>
                <input type="file" name="file" required />
                <button type="submit" class="upload-button">آپلود</button>
            </form>
        </section>

        <!-- Files -->

        <section class="delete-section">
            <div class="delete-section-header">
                <h2>فایل‌های من:</h2>
                <span> {{ files|length }} فایل </span>
            </div>

            <div class="delete-section-body">
                {% for item in files %}
                <article class="files-list">

                    <div class="files-list-item">
                        <span style="font-size: 20px;">📄</span>
                        <div class="image-section">
                            <img src="{{ item.file.url }}" alt="jjjj">
                            <span>{{ item.file.name }}</span>
                            <div>{{ item.uploaded_at|date:"Y/m/d - H:i" }}</div>
                        </div>
                    </div>

                    <div>
                        <!-- Delete -->
                        <form method="POST" action="{% url 'delete_file' item.id %}">
                            {% csrf_token %}
                            <button type="submit">🗑 حذف</button>
                        </form>
                    </div>

                </article>

                {% empty %}

                <div>
                    <div>📂</div>

                    هنوز فایلی آپلود نکرده‌اید.
                </div>

                {% endfor %}
            </div>
        </section>
    </main>
</body>

</html>
